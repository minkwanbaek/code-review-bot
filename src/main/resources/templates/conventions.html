<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Conventions</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --muted-color: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), #1d4ed8);
            color: white;
            margin-bottom: 2rem;
            padding: 2rem 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header h1 {
            font-size: 2rem;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.55rem 1rem;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .btn-muted {
            background: #e2e8f0;
            color: var(--text-color);
        }

        .btn-danger {
            background: var(--error-color);
            color: white;
        }

        .btn-sm {
            padding: 0.35rem 0.65rem;
        }

        .layout {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: minmax(0, 1fr) minmax(360px, 0.8fr);
        }

        .section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            padding: 1.25rem;
        }

        .section-title {
            border-bottom: 1px solid var(--border-color);
            font-size: 1.15rem;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        input,
        select,
        textarea {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font: inherit;
            padding: 0.75rem;
            width: 100%;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr 1fr 140px;
            margin-bottom: 1rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .status-indicator {
            align-items: center;
            color: var(--muted-color);
            display: none;
            font-size: 0.9rem;
            font-weight: 600;
            gap: 0.5rem;
        }

        .status-indicator.active {
            display: inline-flex;
        }

        .status-dot {
            animation: pulse 1s infinite ease-in-out;
            background: var(--primary-color);
            border-radius: 999px;
            height: 0.65rem;
            width: 0.65rem;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.35;
                transform: scale(0.85);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .alert {
            border-radius: 8px;
            margin-bottom: 1rem;
            padding: 1rem;
        }

        .alert-success {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: var(--success-color);
        }

        .alert-error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: var(--error-color);
        }

        .rule-list {
            display: grid;
            gap: 0.75rem;
        }

        .rule-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem;
        }

        .rule-head {
            align-items: center;
            display: flex;
            gap: 0.75rem;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .rule-actions {
            display: flex;
            flex-shrink: 0;
            gap: 0.5rem;
        }

        .rule-summary {
            cursor: pointer;
            font-weight: 700;
            list-style: none;
        }

        .rule-summary::-webkit-details-marker {
            display: none;
        }

        .rule-summary::before {
            content: "▸";
            display: inline-block;
            margin-right: 0.45rem;
            transition: transform 0.15s ease;
        }

        details[open] > .rule-summary::before {
            transform: rotate(90deg);
        }

        .category {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.85rem;
        }

        .category + .category {
            margin-top: 0.75rem;
        }

        .badge {
            background: #eff6ff;
            border-radius: 6px;
            color: var(--primary-color);
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.45rem;
        }

        .muted {
            color: var(--muted-color);
            font-size: 0.9rem;
        }

        pre {
            background: #0f172a;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.85rem;
            overflow: auto;
            padding: 1rem;
        }

        @media (max-width: 900px) {
            .layout,
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <h1>Conventions</h1>
        <div class="nav-buttons">
            <a href="/" class="btn btn-secondary">Back to Dashboard</a>
            <a href="/settings" class="btn btn-secondary">Settings</a>
        </div>
    </div>
</header>

<main class="container">
    <div id="alert-container"></div>

    <div class="layout">
        <div>
            <section class="section">
                <h2 class="section-title">Learn From Text</h2>
                <form onsubmit="learnConventions(event)">
                    <label for="convention-text">Convention notes</label>
                    <textarea id="convention-text" placeholder="Example: Do not use System.out.println. Use 4 spaces. Classes use PascalCase and methods use camelCase."></textarea>
                    <div class="actions">
                        <button type="submit" class="btn btn-primary">Learn Rules</button>
                        <button type="button" class="btn btn-muted" onclick="learnConventionsWithAi()">AI Learn</button>
                        <span id="ai-status" class="status-indicator" aria-live="polite">
                            <span class="status-dot"></span>
                            AI processing
                        </span>
                    </div>
                </form>
            </section>

            <section class="section">
                <h2 class="section-title">Forbidden Patterns</h2>
                <form class="form-row" onsubmit="addPattern(event)">
                    <input id="new-pattern" placeholder="System.out.println" required>
                    <input id="new-description" placeholder="Use logger instead" required>
                    <select id="new-severity">
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                        <option value="INFO">INFO</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Add Pattern</button>
                </form>
                <div id="forbidden-patterns" class="rule-list"></div>
            </section>
        </div>

        <aside>
            <section class="section">
                <h2 class="section-title">Parsed Rules</h2>
                <div id="categorized-rules"></div>
            </section>
        </aside>
    </div>
</main>

<script>
    let conventions = {};
    const categoryConfig = {
        importRules: 'Import Rules',
        namingRules: 'Naming Rules',
        architectureRules: 'Architecture Rules',
        forbiddenPatterns: 'Forbidden Patterns'
    };

    function showAlert(message, type) {
        const container = document.getElementById('alert-container');
        container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        setTimeout(() => container.innerHTML = '', 5000);
    }

    async function loadConventions() {
        const response = await fetch('/api/conventions');
        const data = await response.json();
        if (!data.success) {
            showAlert(data.message || 'Failed to load conventions', 'error');
            return;
        }
        conventions = data.data?.conventions || data.conventions || {};
        renderConventions();
    }

    function renderConventions() {
        renderCategorizedRules();
        renderForbiddenPatternEditor();
    }

    function renderForbiddenPatternEditor() {
        const list = document.getElementById('forbidden-patterns');
        const patterns = conventions.forbiddenPatterns || [];
        if (patterns.length === 0) {
            list.innerHTML = '<p class="muted">No forbidden patterns configured.</p>';
            return;
        }

        list.innerHTML = patterns.map((pattern, index) => `
            <div class="rule-item">
                <div class="rule-head">
                    <strong>${escapeHtml(pattern.pattern || '')}</strong>
                    <span class="badge">${escapeHtml(pattern.severity || 'WARNING')}</span>
                </div>
                <p class="muted">${escapeHtml(ruleMessage(pattern))}</p>
                <div class="actions">
                    <button class="btn btn-sm btn-muted" onclick="editRule('forbiddenPatterns', ${index})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteRule('forbiddenPatterns', ${index})">Delete</button>
                </div>
            </div>
        `).join('');
    }

    async function learnConventions(event) {
        event.preventDefault();
        await learnFromEndpoint('/api/conventions/learn', 'Conventions learned and saved.');
    }

    async function learnConventionsWithAi() {
        await learnFromEndpoint('/api/conventions/learn/ai', 'AI learned conventions and saved them.');
    }

    async function learnFromEndpoint(url, successMessage) {
        const text = document.getElementById('convention-text').value;
        setAiStatus(url.endsWith('/ai'));
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, aiEnabled: url.endsWith('/ai') })
        });
        const data = await response.json();
        setAiStatus(false);
        if (data.success) {
            conventions = data.data?.conventions || data.conventions;
            renderConventions();
            showAlert(successMessage, 'success');
        } else {
            showAlert(data.message || 'Failed to learn conventions', 'error');
        }
    }

    async function addPattern(event) {
        event.preventDefault();
        const pattern = {
            pattern: document.getElementById('new-pattern').value,
            description: document.getElementById('new-description').value,
            severity: document.getElementById('new-severity').value
        };
        await savePattern('/api/conventions/forbidden-patterns', 'POST', pattern);
        event.target.reset();
    }

    async function editPattern(index) {
        await editRule('forbiddenPatterns', index);
    }

    async function deletePattern(index) {
        await deleteRule('forbiddenPatterns', index);
    }

    async function savePattern(url, method, pattern) {
        const response = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(pattern)
        });
        const data = await response.json();
        if (data.success) {
            conventions = data.data?.conventions || data.conventions;
            renderConventions();
            showAlert('Pattern saved.', 'success');
        } else {
            showAlert(data.message || 'Failed to save pattern', 'error');
        }
    }

    async function saveAllConventions(successMessage) {
        normalizeConventions();
        const response = await fetch('/api/conventions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(conventions)
        });
        const data = await response.json();
        if (data.success) {
            conventions = data.data?.conventions || data.conventions;
            renderConventions();
            showAlert(successMessage, 'success');
        } else {
            showAlert(data.message || 'Failed to save conventions', 'error');
        }
    }

    function renderCategorizedRules() {
        const grouped = buildRuleGroups();
        document.getElementById('categorized-rules').innerHTML = Object.entries(categoryConfig).map(([category, title]) => {
            const rules = grouped[category] || [];
            return `
                <details class="category" open>
                    <summary class="rule-summary">${title} <span class="badge">${rules.length}</span></summary>
                    <div class="rule-list">
                        ${rules.length === 0 ? `<p class="muted">No ${title.toLowerCase()} configured.</p>` : rules.map(ruleCard).join('')}
                    </div>
                </details>
            `;
        }).join('');
    }

    function ruleCard(rule) {
        return `
            <div class="rule-item">
                <div class="rule-head">
                    <strong>${escapeHtml(rule.title)}</strong>
                    <div class="rule-actions">
                        ${rule.badge ? `<span class="badge">${escapeHtml(rule.badge)}</span>` : ''}
                        <button class="btn btn-sm btn-muted" onclick="editRule('${rule.kind}', ${rule.index})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteRule('${rule.kind}', ${rule.index})">Delete</button>
                    </div>
                </div>
                <p class="muted">${escapeHtml(rule.description)}</p>
            </div>
        `;
    }

    function buildRuleGroups() {
        const importRules = (conventions.importRules || []).map((rule, index) => ({
            kind: 'importRules',
            index,
            title: `Import rule ${index + 1}`,
            badge: (rule.order || []).join(' -> ') || 'ORDER',
            description: [
                rule.message || '',
                (rule.forbiddenImports || []).length ? `Forbidden: ${(rule.forbiddenImports || []).join(', ')}` : ''
            ].filter(Boolean).join(' | ') || 'No import rule message'
        }));
        if (importRules.length === 0 && (conventions.importOrder || []).length > 0) {
            importRules.push({
                kind: 'importOrder',
                index: 0,
                title: 'Import order',
                badge: 'ORDER',
                description: (conventions.importOrder || []).join(' -> ')
            });
        }

        const namingSource = conventions.namingRules && Object.keys(conventions.namingRules).length
            ? conventions.namingRules
            : (conventions.namingPatterns || {});
        const namingRules = Object.entries(namingSource).map(([name, value], index) => ({
            kind: 'namingRules',
            index,
            title: name,
            badge: String(value),
            description: `${name} must use ${value}`
        }));

        const archRules = (conventions.archRules || []).map((rule, index) => ({
            kind: 'archRules',
            index,
            title: `${rule.fromLayer || 'source'} -> ${rule.toLayer || 'target'}`,
            badge: rule.allowed ? 'ALLOWED' : (rule.severity || 'ERROR'),
            description: rule.message || `Dependency is ${rule.allowed ? 'allowed' : 'forbidden'}`
        }));
        const dependencyRules = (conventions.dependencyRules || []).map((rule, index) => ({
            kind: 'dependencyRules',
            index,
            title: `${rule.layer || 'layer'} dependencies`,
            badge: rule.severity || 'ERROR',
            description: [
                rule.message || '',
                (rule.forbiddenDependencies || []).length ? `Forbidden: ${(rule.forbiddenDependencies || []).join(', ')}` : ''
            ].filter(Boolean).join(' | ') || 'No dependency rule message'
        }));

        const forbiddenPatterns = (conventions.forbiddenPatterns || []).map((pattern, index) => ({
            kind: 'forbiddenPatterns',
            index,
            title: pattern.pattern || `Forbidden pattern ${index + 1}`,
            badge: pattern.severity || 'WARNING',
            description: ruleMessage(pattern)
        }));

        return {
            importRules,
            namingRules,
            architectureRules: archRules.concat(dependencyRules),
            forbiddenPatterns
        };
    }

    async function editRule(kind, index) {
        normalizeConventions();
        if (kind === 'namingRules') {
            await editNamingRule(index);
            return;
        }
        if (kind === 'importOrder') {
            await editImportOrder();
            return;
        }

        const collection = conventions[kind] || [];
        const current = collection[index];
        const next = prompt('Edit rule JSON', JSON.stringify(current, null, 2));
        if (next === null) return;
        try {
            collection[index] = JSON.parse(next);
            conventions[kind] = collection;
            await saveAllConventions('Rule updated.');
        } catch (error) {
            showAlert('Rule JSON is invalid.', 'error');
        }
    }

    async function editNamingRule(index) {
        const keys = Object.keys(conventions.namingRules || {});
        const key = keys[index];
        const nextKey = prompt('Name', key || '');
        if (nextKey === null || nextKey.trim() === '') return;
        const nextValue = prompt('Pattern', conventions.namingRules[key] || '');
        if (nextValue === null) return;
        delete conventions.namingRules[key];
        conventions.namingRules[nextKey.trim()] = nextValue.trim();
        conventions.namingPatterns = { ...conventions.namingRules };
        await saveAllConventions('Rule updated.');
    }

    async function editImportOrder() {
        const next = prompt('Import order, comma separated', (conventions.importOrder || []).join(', '));
        if (next === null) return;
        conventions.importOrder = splitCsv(next);
        await saveAllConventions('Rule updated.');
    }

    async function deleteRule(kind, index) {
        if (!confirm('Delete this rule?')) return;
        normalizeConventions();
        if (kind === 'namingRules') {
            const keys = Object.keys(conventions.namingRules || {});
            delete conventions.namingRules[keys[index]];
            conventions.namingPatterns = { ...conventions.namingRules };
        } else if (kind === 'importOrder') {
            conventions.importOrder = [];
        } else {
            conventions[kind] = (conventions[kind] || []).filter((_, currentIndex) => currentIndex !== index);
        }
        await saveAllConventions('Rule deleted.');
    }

    function normalizeConventions() {
        conventions.importOrder = conventions.importOrder || [];
        conventions.importRules = conventions.importRules || [];
        conventions.namingRules = conventions.namingRules || {};
        if (Object.keys(conventions.namingRules).length === 0 && conventions.namingPatterns) {
            conventions.namingRules = { ...conventions.namingPatterns };
        }
        conventions.namingPatterns = conventions.namingPatterns || {};
        conventions.formattingRules = conventions.formattingRules || {};
        conventions.commonPatterns = conventions.commonPatterns || [];
        conventions.archRules = conventions.archRules || [];
        conventions.dependencyRules = conventions.dependencyRules || [];
        conventions.forbiddenPatterns = conventions.forbiddenPatterns || [];
    }

    function ruleMessage(rule) {
        return rule.description || rule.message || '';
    }

    function splitCsv(value) {
        return value.split(',').map(item => item.trim()).filter(Boolean);
    }

    function setAiStatus(active) {
        document.getElementById('ai-status').classList.toggle('active', active);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    document.addEventListener('DOMContentLoaded', loadConventions);
</script>
</body>
</html>
